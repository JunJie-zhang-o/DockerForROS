# 示例:
# actionlib:     # 功能包名称
#   ubuntu:
#     focal: ros-foxy-actionlib   # foxy on focal
#     jammy: ros-humble-actionlib  # humble on jammy
#     noble: ros-jazzy-actionlib   # jazzy on noble
# 注意: 按 ubuntu 版本 (focal/jammy/noble) 生效
# focal: ROS1 Noetic / ROS2 Foxy
# jammy: ROS1 Noetic / ROS2 Humble
# noble: ROS2 Jazzy
# 该文件用来标识ros依赖,即如果在功能包中有依赖 自定义的功能包的话,需要在该文件中列出
